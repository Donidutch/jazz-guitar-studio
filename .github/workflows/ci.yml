name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint joins once its 8 existing errors are fixed (see docs/STATUS.md).
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
